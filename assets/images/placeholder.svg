<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Photograph placeholder">
  <defs>
    <pattern id="weave" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e6dbc7"/>
      <path d="M0 20h40M20 0v40" stroke="#dccdb2" stroke-width="1"/>
      <circle cx="20" cy="20" r="2.5" fill="#cdb894"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#weave)"/>
  <rect x="60" y="60" width="1480" height="880" fill="none" stroke="#c2ab86" stroke-width="1"/>
  <rect x="80" y="80" width="1440" height="840" fill="none" stroke="#c2ab86" stroke-width="1" stroke-dasharray="6 8"/>
  <g fill="#8b8172" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="800" y="480" font-size="54" letter-spacing="2">Photograph goes here</text>
    <text x="800" y="548" font-size="26" font-family="Helvetica, Arial, sans-serif" letter-spacing="6" fill="#a1957f">
      DROP YOUR IMAGE INTO assets/images/ USING THE FILENAME IN THE CAPTION
    </text>
  </g>
</svg>
