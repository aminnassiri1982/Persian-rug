# Publishes the site to GitHub Pages.
#
# ONE-TIME SETUP, done by a person once:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# That single dropdown is unavoidable. A workflow cannot switch Pages on for
# itself: creating a Pages site needs administration rights, which GITHUB_TOKEN
# cannot be granted, so the API answers "Resource not accessible by
# integration". After that one change this workflow deploys on every push.
#
# Every asset path in index.html is relative, so serving from the
# /Persian-rug/ subfolder works with no changes to the site.
#
# The site appears at https://aminnassiri1982.github.io/Persian-rug/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it midway.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
